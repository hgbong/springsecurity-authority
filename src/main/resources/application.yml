server:
  servlet:
    session:
      cookie:
        name: JSESSIONID123
spring:
  profiles:
    active: local


  data:
    redis:
      #host: invalid_localhost
      host: localhost
      password:
      port: 6379

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: sa
    password: 123

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hiberate:
         dialect: org.hibernate.dialect.H2Dialect
         format_sql: true

  session:
    store-type: redis
    redis:
      namespace: hg:session


  config:
    # 아래 모두 not working..?
    location: 'classpath:myloc/' # 최종 resource 참조 위치: classpath:myloc/
    # additional-location: 'classpath:myloc/' # 최종 resource 참조 위치: classpath:/ , classpath:config/, classpath:myloc/


    # 아래 import 설정들 모두 유효
    #import: 'classpath:myconfig2.yml,classpath:myconfig.yml'
    import:
      - 'classpath:myconfig.yml'
      - 'classpath:myconfig2.yml'
      - 'classpath:ldap.yml'
my:
  test: application2.yml
  loc: application default loc

logging:
  level:
    root: debug