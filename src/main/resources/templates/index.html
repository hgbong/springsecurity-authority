<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>User List</h1>
    <div>any authenticated user can access this page.</div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.userId}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
        </tr>
        </tbody>
    </table>

    <div class="mt-4">

        <!-- 만약 static html을 바로 제공하려는 경우 (SSR X) -->
        <!--        <a href="/manage-auth.html" class="btn btn-primary">권한 변경하러 가기</a>-->
        <a href="/manage-auth" class="btn btn-primary">권한 변경하러 가기</a>
        <a href="/logout" class="btn btn-primary">로그아웃</a>
    </div>
</div>
</body>
</html>
