<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage User Authorization</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>Manage User Authorization</h1>

    <form id="authForm">
        <div class="mb-3">
            <label for="userSelect" class="form-label">Select User</label>
            <select id="userSelect" class="form-select" required>
                <option value="" disabled selected>Select a user</option>
                <option th:each="user : ${users}" th:value="${user.userId}" th:text="${user.username}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="roleSelect" class="form-label">Select Role</label>
            <select id="roleSelect" class="form-select" required>
                <option value="ADMIN">ADMIN</option>
                <option value="DEVELOPER">DEVELOPER</option>
                <option value="VIEWER">VIEWER</option>
            </select>
        </div>

        <button type="button" class="btn btn-primary" onclick="changeUserRole()">Change Role</button>
        <a href="/" class="btn btn-primary">인덱스 페이지 이동하기</a>
    </form>
</div>

<script src="/manage-auth.js"></script>

</body>
</html>
